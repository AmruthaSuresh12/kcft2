[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirect /api/contact → Netlify Function
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Redirect /api/register → Netlify Function
[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200

# Redirect /api/gallery-media → Netlify Function
[[redirects]]
  from = "/api/gallery-media"
  to = "/.netlify/functions/gallery-media"
  status = 200

# SPA fallback — all other routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
