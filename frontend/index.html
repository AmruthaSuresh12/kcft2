<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KCFT — Keerthana Creative Foundation Trust</title>

    <!-- Google Translate -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'kn,en',
            autoDisplay: false,
          },
          'google_translate_element'
        );
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Hide default Google Translate toolbar & top banner -->
    <style>
      /* Hide the Google Translate top bar */
      .goog-te-banner-frame,
      .goog-te-balloon-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .skiptranslate {
        display: none !important;
      }
      body {
        top: 0 !important;
      }
      /* Hide the translate element container */
      #google_translate_element {
        display: none !important;
      }
      /* Prevent font distortion from Google Translate */
      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Hidden Google Translate trigger element -->
    <div id="google_translate_element"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
